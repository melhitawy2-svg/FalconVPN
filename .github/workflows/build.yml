name: Build APK
# The APK is built and uploaded FIRST. Unit tests, lint and UI tests run afterwards and never block the APK:
# a failing check must not hide an APK you can install and try on a phone.
on:
  workflow_dispatch:
    inputs:
      trust_first_download:
        description: "Continue if libbox.aar's SHA-256 differs from libbox.sha256 (the real hash is printed in the run summary; review it, then update libbox.sha256)"
        type: boolean
        default: false
      abis:
        description: "ABIs to package, comma separated (libbox.aar must contain them). Emulator: arm64-v8a,x86_64"
        default: arm64-v8a
      libbox_url:
        description: "Optional URL of a libbox.aar you built yourself. Empty = JitPack singbox-android/libbox 1.13.14"
        default: ""
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ABIS: ${{ inputs.abis || 'arm64-v8a' }}
      TRUST_FIRST_DOWNLOAD: ${{ inputs.trust_first_download && 'true' || 'false' }}
      LIBBOX_URL: ${{ inputs.libbox_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Do not rely on runner-preinstalled SDK state: install tools and accept licenses explicitly.
      - uses: android-actions/setup-android@v4
      - name: Install Android 35 platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Fetch libbox (hash-pinned) and dump its API
        run: bash tools/fetch_libbox.sh "$LIBBOX_URL"
      - name: Upload libbox API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libbox-api
          path: build-reports/
          if-no-files-found: ignore
      - name: Build APK and verify packaged services
        run: gradle :app:verifyDebugApkContents --no-daemon --stacktrace -PfalconAbis="$ABIS"
      - name: Compute APK checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum *.apk | tee SHA256SUMS.txt
          { echo "### APK"; echo '```'; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: falcon-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
      # ---- checks below never block the APK above ----
      - name: Unit tests
        if: always()
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace -PfalconAbis="$ABIS"
      - name: Android lint
        if: always()
        continue-on-error: true
        run: gradle :app:lintDebug --no-daemon --stacktrace -PfalconAbis="$ABIS"
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
