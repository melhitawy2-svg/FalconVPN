name: Falcon VPN Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify ZIP File
        run: |
          ZIP_FILE="$GITHUB_WORKSPACE/FalconVPN-Starter.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: FalconVPN-Starter.zip not found!"
            ls -lah
            exit 1
          fi

          echo "ZIP file verified:"
          unzip -l "$ZIP_FILE"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -q FalconVPN-Starter.zip -d extracted

          echo "Extracted ZIP contents:"
          find extracted -maxdepth 4 -type f | sort

      - name: Verify Starter Folder
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/extracted/FalconVPN-Starter/Starter"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Starter folder not found!"
            find extracted -maxdepth 5 -type d | sort
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: Gradle settings file not found in Starter!"
            find "$PROJECT_DIR" -maxdepth 3 -type f | sort
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: App Gradle file not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Starter project verified successfully."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"
            find "$PROJECT_DIR/app/build/outputs" -type f | sort
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK found: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FalconVPN-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
