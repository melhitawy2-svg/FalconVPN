name: Falcon VPN Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Falcon VPN APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract and configure Android project
        shell: bash
        run: |
          set -e

          if [ ! -f FalconVPN-Starter.zip ]; then
            echo "ERROR: FalconVPN-Starter.zip is missing"
            ls -la
            exit 1
          fi

          mkdir -p project
          unzip -oq FalconVPN-Starter.zip -d project

          if [ -f project/FalconVPN-Starter/settings.gradle.kts ]; then
            cp -a project/FalconVPN-Starter/. project/
            rm -rf project/FalconVPN-Starter
          fi

          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

          echo "=== Configure Java and Kotlin targets ==="

          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/build.gradle.kts")
          s = p.read_text()

          java_config = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """

          if "compileOptions" not in s:
              marker = "android {"
              if marker not in s:
                  raise SystemExit("ERROR: android block not found")
              s = s.replace(
                  marker,
                  marker + java_config,
                  1
              )

          kotlin_config = """
          
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          if "jvmTarget" not in s:
              s = s.rstrip() + kotlin_config + "\n"

          p.write_text(s)

          print("Updated app/build.gradle.kts")
          print(s)
          PY

          echo "=== Verify project files ==="
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

          echo "SUCCESS: Project prepared"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            find project/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "SUCCESS: APK generated"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-VPN-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
