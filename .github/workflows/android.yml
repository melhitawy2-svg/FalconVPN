name: Falcon VPN Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Falcon VPN APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract and configure Android project
        shell: bash
        run: |
          set -e

          echo "=== Checking ZIP file ==="

          if [ ! -f FalconVPN-Starter.zip ]; then
            echo "ERROR: FalconVPN-Starter.zip is missing"
            ls -la
            exit 1
          fi

          echo "=== Extracting project ==="

          mkdir -p project
          unzip -oq FalconVPN-Starter.zip -d project

          if [ -f project/FalconVPN-Starter/settings.gradle.kts ]; then
            cp -a project/FalconVPN-Starter/. project/
            rm -rf project/FalconVPN-Starter
          fi

          echo "=== Verifying project files ==="

          if [ ! -f project/settings.gradle.kts ]; then
            echo "ERROR: settings.gradle.kts not found"
            find project -maxdepth 3 -type f
            exit 1
          fi

          if [ ! -f project/app/build.gradle.kts ]; then
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          fi

          echo "=== Configuring Java and Kotlin JVM target ==="

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("project/app/build.gradle.kts")
          s = p.read_text()

          # Set Java source and target compatibility to 17.
          compile_block = re.compile(
              r'compileOptions\s*\{.*?\}',
              re.DOTALL
          )

          new_compile_block = """compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }"""

          if compile_block.search(s):
              s = compile_block.sub(new_compile_block, s, count=1)
          else:
              android_block = re.search(r'\bandroid\s*\{', s)
              if not android_block:
                  raise SystemExit(
                      "ERROR: Could not find android { } block"
                  )
              pos = android_block.end()
              s = (
                  s[:pos]
                  + "\n    "
                  + new_compile_block
                  + "\n"
                  + s[pos:]
              )

          # Set Kotlin JVM target to 17.
          kotlin_options = re.compile(
              r'kotlinOptions\s*\{.*?\}',
              re.DOTALL
          )

          new_kotlin_options = """kotlinOptions {
                  jvmTarget = "17"
              }"""

          if kotlin_options.search(s):
              s = kotlin_options.sub(
                  new_kotlin_options, s, count=1
              )
          elif re.search(r'\bkotlin\s*\{', s):
              # Use the toolchain when a Kotlin extension exists
              s = re.sub(
                  r'\bkotlin\s*\{',
                  'kotlin {\n    jvmToolchain(17)',
                  s,
                  count=1
              )
          else:
              s += """

          kotlin {
              jvmToolchain(17)
          }
          """

          p.write_text(s)

          print("Updated app/build.gradle.kts")
          print(s)
          PY

          echo "SUCCESS: Project extracted and configured"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "=== Searching for APK ==="

          find project/app/build/outputs/apk \
            -type f -name "*.apk"

          test -f project/app/build/outputs/apk/debug/app-debug.apk

          echo "SUCCESS: Debug APK created"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-VPN-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
