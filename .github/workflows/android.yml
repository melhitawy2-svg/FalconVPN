      - name: Extract and verify Android project
        shell: bash
        run: |
          set -e

          echo "=== Checking ZIP ==="
          test -f FalconVPN-Starter.zip

          echo "=== Extracting project ==="
          rm -rf project
          mkdir -p project
          unzip -oq FalconVPN-Starter.zip -d project

          echo "=== Locating Gradle project ==="

          if [ -f project/FalconVPN-Starter/settings.gradle.kts ]; then
            cp -a project/FalconVPN-Starter/. project/
          fi

          echo "=== Verifying files ==="
          find project -maxdepth 3 -type f | sort | head -80

          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

          echo "SUCCESS: Android project files verified"
