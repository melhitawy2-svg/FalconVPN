name: Falcon VPN Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Falcon VPN APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract and verify Android project
        shell: bash
        run: |
          set -e

          echo "=== Checking ZIP file ==="

          if [ ! -f FalconVPN-Starter.zip ]; then
            echo "ERROR: FalconVPN-Starter.zip is missing from repository root"
            ls -la
            exit 1
          fi

          echo "=== Extracting Android project ==="

          mkdir -p project
          unzip -oq FalconVPN-Starter.zip -d project

          echo "=== Checking extracted directory ==="

          if [ -f project/FalconVPN-Starter/settings.gradle.kts ]; then
            cp -a project/FalconVPN-Starter/. project/
            rm -rf project/FalconVPN-Starter
          fi

          echo "=== Project files ==="

          find project -maxdepth 3 -type f | sort | head -100

          echo "=== Verifying required files ==="

          if [ ! -f project/settings.gradle.kts ]; then
            echo "ERROR: settings.gradle.kts was not found"
            exit 1
          fi

          if [ ! -f project/app/build.gradle.kts ]; then
            echo "ERROR: app/build.gradle.kts was not found"
            exit 1
          fi

          echo "SUCCESS: Android project files verified"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "=== Searching for APK ==="

          find project/app/build/outputs/apk -type f -name "*.apk"

          test -f project/app/build/outputs/apk/debug/app-debug.apk

          echo "SUCCESS: Debug APK created"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-VPN-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
