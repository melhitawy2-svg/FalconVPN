name: Falcon VPN Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract and verify Android project
        run: |
          if [ ! -f FalconVPN-Starter.zip ]; then
            echo "ERROR: FalconVPN-Starter.zip is missing from repository root"
            ls -la
            exit 1
          fi

          mkdir -p project
          unzip -q FalconVPN-Starter.zip -d project

          if [ ! -f project/settings.gradle.kts ]; then
            echo "ERROR: settings.gradle.kts was not found after extraction"
            find project -maxdepth 3 -type f | head -80
            exit 1
          fi

          test -f project/app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p project assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-VPN-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
