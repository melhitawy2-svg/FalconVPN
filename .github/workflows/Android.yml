name: Falcon VPN Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verify and extract project ZIP
        run: |
          test -f FalconVPN-Starter.zip || { echo 'Missing FalconVPN-Starter.zip in repository root'; exit 1; }
          mkdir -p project
          unzip -q FalconVPN-Starter.zip -d project
          test -f project/settings.gradle.kts || { echo 'ZIP must contain settings.gradle.kts at its root'; exit 1; }
          test -f project/app/build.gradle.kts || { echo 'ZIP must contain app/build.gradle.kts'; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p project assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-VPN-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
