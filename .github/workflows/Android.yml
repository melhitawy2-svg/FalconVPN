name: Falcon VPN Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f FalconVPN-Starter.zip
          mkdir -p project
          unzip -q FalconVPN-Starter.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -f project/gradlew ]; then
            chmod +x project/gradlew
            cd project
            ./gradlew app:assembleDebug --no-daemon
          else
            gradle -p project app:assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-VPN-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
