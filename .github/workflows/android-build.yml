name: FalconVPN Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FalconVPN APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          if [ ! -f "FalconVPN-Starter.zip" ]; then
            echo "ERROR: FalconVPN-Starter.zip not found"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -o FalconVPN-Starter.zip -d extracted

          PROJECT_DIR=$(find extracted -type f -path "*/app/build.gradle.kts" -print -quit | xargs -r dirname | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app/build.gradle.kts not found inside ZIP"
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

          echo "Project extracted successfully"
          ls -la
          ls -la app

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FalconVPN-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
