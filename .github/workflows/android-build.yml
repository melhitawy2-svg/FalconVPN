name: FalconVPN Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FalconVPN APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        shell: bash
        run: |
          if [ ! -f "FalconVPN-Starter.zip" ]; then
            echo "::error::FalconVPN-Starter.zip not found in repository root"
            echo "Check the ZIP filename and repository location."
            exit 1
          fi

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted
          unzip -q -o FalconVPN-Starter.zip -d extracted

          PROJECT_DIR="$(find extracted -type f -path '*/app/build.gradle.kts' -print -quit | xargs -r dirname | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Could not find app/build.gradle.kts inside ZIP"
            unzip -l FalconVPN-Starter.zip | head -100
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "::error::Gradle settings file not found in project root"
            exit 1
          fi

          echo "Project extracted successfully."
          ls -la
          ls -la app

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/debug"

          if [ ! -d "$APK_PATH" ]; then
            echo "::error::APK output directory was not created"
            exit 1
          fi

          find "$APK_PATH" -maxdepth 1 -type f -name '*.apk' -print

          if ! find "$APK_PATH" -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo "::error::No APK file was generated"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FalconVPN-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
