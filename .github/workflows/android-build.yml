name: FalconVPN Android Build

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build FalconVPN APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Check ZIP file
    run: |
      if [ ! -f "FalconVPN-Starter.zip" ]; then
        echo "ERROR: FalconVPN-Starter.zip not found in repository root"
        exit 1
      fi

  - name: Extract project ZIP
    run: |
      unzip -o FalconVPN-Starter.zip -d extracted

      PROJECT_FILE=$(find extracted -type f -path "*/app/build.gradle.kts" -print -quit)

      if [ -z "$PROJECT_FILE" ]; then
        echo "ERROR: app/build.gradle.kts not found inside ZIP"
        exit 1
      fi

      PROJECT_DIR=$(dirname "$(dirname "$PROJECT_FILE")")

      cp -a "$PROJECT_DIR"/. .

      echo "Project extracted successfully"
      ls -la
      ls -la app

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build Debug APK
    run: gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: FalconVPN-Debug-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
